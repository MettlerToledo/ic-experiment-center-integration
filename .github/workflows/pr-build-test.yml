name: PR Build and Test

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/MettlerToledo.Labs.Experiments.slnx

      - name: Build
        run: dotnet build src/MettlerToledo.Labs.Experiments.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project src/MettlerToledo.Labs.Experiments.UnitTests/MettlerToledo.Labs.Experiments.UnitTests.csproj --configuration Release --no-build
