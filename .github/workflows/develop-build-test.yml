name: PR Build and Test

on:
  push:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/MettlerToledo.Labs.Experiments.slnx

      - name: Build
        run: dotnet build src/MettlerToledo.Labs.Experiments.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project src/MettlerToledo.Labs.Experiments.UnitTests/MettlerToledo.Labs.Experiments.UnitTests.csproj --configuration Release --no-build

      - name: Package
        run: dotnet pack src/MettlerToledo.Labs.Experiments.Packages.slnf --configuration Release --no-build --output ./artifacts /p:PackageVersion=1.0.0-dev-${GITHUB_RUN_NUMBER}

      - name: Upload NuGet package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Publish Package
        run: dotnet nuget add source ${{ secrets.PACKAGE_PUSH_PATH }} --name azdevops --username AutoChem --password ${{ secrets.PACKAGE_PUSH_KEY }} --store-password-in-clear-text
      - run: dotnet nuget push ./artifacts/*.nupkg --source azdevops --api-key RequiredUnusedKey